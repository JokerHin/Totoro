trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
    exclude:
      - terraform/**
      - frontend/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**

pool:
  vmImage: "ubuntu-latest"

variables:
  AWS_SERVICE_CONNECTION: "AWS-OIDC-ServiceConnection"
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "totoro-backend"

stages:
  - stage: Quality_And_Security
    displayName: "Backend Quality & Security Checks"
    jobs:
      - job: Python_Analysis
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"

          - script: |
              cd backend
              python -m pip install --upgrade pip
              pip install ruff bandit safety

              echo "==> Running Ruff Linter <=="
              ruff check .

              echo "==> Running Bandit Static Security Scan <=="
              bandit -r . -x ./venv

              echo "==> Running Safety Dependency Vulnerability Scan <=="
              pip install -r requirements.txt
              safety check --full-report || true
            displayName: "Ruff, Bandit & Safety Scans"

  - stage: Podman_Build_And_Push
    displayName: "Podman Build & Push to ECR"
    dependsOn: Quality_And_Security
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildAndPush
        steps:
          - task: AWSShellScript@1
            displayName: "Podman Login, Build & Push"
            inputs:
              awsCredentials: "$(AWS_SERVICE_CONNECTION)"
              regionName: "$(AWS_REGION)"
              scriptType: "inline"
              inlineScript: |
                # Retrieve Account ID dynamically via OIDC session
                AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                IMAGE_TAG="$(Build.BuildId)"

                echo "==> Authenticating Podman to ECR <=="
                aws ecr get-login-password --region $(AWS_REGION) | podman login --username AWS --password-stdin $ECR_REGISTRY

                echo "==> Building Backend Container Image <=="
                cd backend
                podman build -t $ECR_REGISTRY/$(ECR_REPOSITORY):$IMAGE_TAG -t $ECR_REGISTRY/$(ECR_REPOSITORY):latest .

                echo "==> Pushing Image to AWS ECR <=="
                podman push $ECR_REGISTRY/$(ECR_REPOSITORY):$IMAGE_TAG
                podman push $ECR_REGISTRY/$(ECR_REPOSITORY):latest
