trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
    exclude:
      - backend/**
      - frontend/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: "ubuntu-latest"

variables:
  AWS_SERVICE_CONNECTION: "AWS-OIDC-ServiceConnection"
  AWS_REGION: "us-east-1"
  TERRAFORM_VERSION: "1.6.6"

stages:
  - stage: Terraform_Validate_And_Plan
    displayName: "Validate & Plan Infrastructure"
    jobs:
      - job: Plan
        steps:
          # Install Terraform binary on the agent
          - script: |
              sudo apt-get update && sudo apt-get install -y wget unzip
              wget https://releases.hashicorp.com/terraform/$(TERRAFORM_VERSION)/terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
              unzip terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: "Install Terraform"

          - script: |
              cd terraform
              echo "==> Checking Formatting <=="
              terraform fmt -check
            displayName: "Terraform Format Check"

          - task: AWSShellScript@1
            displayName: "Terraform Init & Plan"
            inputs:
              awsCredentials: "$(AWS_SERVICE_CONNECTION)"
              regionName: "$(AWS_REGION)"
              scriptType: "inline"
              inlineScript: |
                cd terraform
                terraform init
                terraform validate
                terraform plan -out=tfplan

          - script: |
              pip install checkov
              checkov -d terraform/ --framework terraform --soft-fail
            displayName: "Checkov Security Scan"

          - publish: terraform/tfplan
            artifact: terraform-plan

  - stage: Terraform_Apply
    displayName: "Apply Infrastructure Changes"
    dependsOn: Terraform_Validate_And_Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        environment: "AWS-Production-Infrastructure"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # Install Terraform binary on the deployment agent
                - script: |
                    sudo apt-get update && sudo apt-get install -y wget unzip
                    wget https://releases.hashicorp.com/terraform/$(TERRAFORM_VERSION)/terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
                    unzip terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
                    sudo mv terraform /usr/local/bin/
                    terraform --version
                  displayName: "Install Terraform"

                - download: current
                  artifact: terraform-plan

                - task: AWSShellScript@1
                  displayName: "Terraform Apply"
                  inputs:
                    awsCredentials: "$(AWS_SERVICE_CONNECTION)"
                    regionName: "$(AWS_REGION)"
                    scriptType: "inline"
                    inlineScript: |
                      cd terraform
                      terraform init
                      cp $(Pipeline.Workspace)/terraform-plan/tfplan .
                      terraform apply -auto-approve tfplan
