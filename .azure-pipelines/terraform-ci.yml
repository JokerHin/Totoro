trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
    exclude:
      - backend/**
      - frontend/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: "ubuntu-latest"

variables:
  AWS_SERVICE_CONNECTION: "AWS-OIDC-ServiceConnection"
  AWS_REGION: "us-east-1"

stages:
  - stage: Terraform_Validate_And_Plan
    displayName: "Validate & Plan Infrastructure"
    jobs:
      - job: Plan
        steps:
          - script: |
              cd terraform
              echo "==> Checking Formatting <=="
              terraform fmt -check
            displayName: "Terraform Format Check"

          - task: AWSShellScript@1
            displayName: "Terraform Init & Plan"
            inputs:
              awsCredentials: "$(AWS_SERVICE_CONNECTION)"
              regionName: "$(AWS_REGION)"
              scriptType: "inline"
              inlineScript: |
                cd terraform
                terraform init
                terraform validate
                terraform plan -out=tfplan

          - script: |
              pip install checkov
              checkov -d terraform/ --framework terraform --soft-fail
            displayName: "Checkov Security Scan"

          - publish: terraform/tfplan
            artifact: terraform-plan

  - stage: Terraform_Apply
    displayName: "Apply Infrastructure Changes"
    dependsOn: Terraform_Validate_And_Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        environment: "AWS-Production-Infrastructure"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: terraform-plan

                - task: AWSShellScript@1
                  displayName: "Terraform Apply"
                  inputs:
                    awsCredentials: "$(AWS_SERVICE_CONNECTION)"
                    regionName: "$(AWS_REGION)"
                    scriptType: "inline"
                    inlineScript: |
                      cd terraform
                      terraform init
                      cp $(Pipeline.Workspace)/terraform-plan/tfplan .
                      terraform apply -auto-approve tfplan
