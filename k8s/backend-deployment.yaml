apiVersion: apps/v1
kind: Deployment
metadata:
  name: totoro-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: totoro-backend
  template:
    metadata:
      labels:
        app: totoro-backend
    spec:
      containers:
        - name: backend
          image: 112613577929.dkr.ecr.us-east-1.amazonaws.com/totoro-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: totoro-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: totoro-backend-service
spec:
  type: ClusterIP
  selector:
    app: totoro-backend
  ports:
    - port: 8000
      targetPort: 8000
