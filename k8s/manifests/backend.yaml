apiVersion: apps/v1
kind: Deployment
metadata:
  name: totoro-backend
  namespace: default
  labels:
    app: totoro-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: totoro-backend
  template:
    metadata:
      labels:
        app: totoro-backend
    spec:
      containers:
        - name: totoro-backend
          image: 112613577929.dkr.ecr.us-east-1.amazonaws.com/totoro-backend:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: totoro-backend-service
  namespace: default
  labels:
    app: totoro-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8000
      protocol: TCP
  selector:
    app: totoro-backend
