apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-db-credentials-es
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: rds-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: totoro/db-credentials
    - extract:
        key: totoro/groq-api-key
