apiVersion: apps/v1
kind: Deployment
metadata:
  name: totoro-frontend
  namespace: default
  labels:
    app: totoro-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: totoro-frontend
  template:
    metadata:
      labels:
        app: totoro-frontend
    spec:
      containers:
        - name: totoro-frontend
          image: 112613577929.dkr.ecr.us-east-1.amazonaws.com/totoro-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: ""
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
